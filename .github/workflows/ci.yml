name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: biokey_ci_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biokey_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: biokey_ci_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      APP_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SESSION_TOKEN_PEPPER: ci_session_token_pepper_0123456789abcdef0123456789abcdef
      APP_AUTH_PEPPER: ci_auth_pepper_0123456789abcdef
      APP_REQUIRE_HTTPS: "false"
    defaults:
      run:
        working-directory: backend-server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: backend-server

      - name: Run backend tests
        run: |
          bundle exec ruby -c app.rb
          bundle exec ruby -c worker.rb
          bundle exec ruby -e "require 'pg'; connected=false; 30.times do; begin; PG.connect(dbname: ENV['DB_NAME'], user: ENV['DB_USER'], password: ENV['DB_PASSWORD'], host: ENV['DB_HOST']).close; connected=true; break; rescue; sleep 1; end; end; abort('postgres not ready') unless connected"
          bundle exec ruby db/migrate.rb
          bundle exec ruby -Itest test/auth_service_test.rb
          bundle exec ruby -Itest test/evaluation_service_test.rb
          bundle exec ruby -Itest test/integration_api_test.rb

      - name: Readiness and performance gate
        env:
          ADMIN_TOKEN_HASH: 3155b165e9b9b9fe6602b25e139a285bfea090df9b7edbcc08c5f7d224f25438
          REQUIRE_ADMIN_TOKEN_HASH: "false"
          PERF_GATE_URL: http://127.0.0.1:4567/health
          PERF_GATE_REQUESTS: "30"
          PERF_GATE_P95_MS: "500"
        run: |
          bundle exec ruby app.rb > /tmp/biokey_app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4567/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4567/ready
          bundle exec ruby tools/perf_smoke_gate.rb

      - name: Install security scanners
        run: |
          gem install brakeman bundler-audit

      - name: Brakeman SAST
        run: brakeman -q -w2 -A --force .

      - name: Dependency audit
        run: |
          bundle-audit update
          bundle-audit check

  android-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Android debug build
        run: ./gradlew :app:assembleDebug --no-daemon
