name: Backend Tests & Quality

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend-server/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend-server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: biokey_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: backend-server
    
    - name: Create database
      working-directory: backend-server
      env:
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: biokey_test
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE biokey_test;" || true

    - name: Run migrations
      working-directory: backend-server
      env:
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: biokey_test
        APP_ENV: test
        RACK_ENV: test
      run: bundle exec ruby db/migrate.rb
    
    - name: Run tests
      working-directory: backend-server
      env:
        DB_HOST: localhost
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: biokey_test
        ADMIN_TOKEN: ci-admin-token
        ADMIN_TOKEN_HASH: 3155b165e9b9b9fe6602b25e139a285bfea090df9b7edbcc08c5f7d224f25438
        APP_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        SESSION_TOKEN_PEPPER: ci_session_token_pepper_0123456789abcdef0123456789abcdef
        APP_AUTH_PEPPER: ci_auth_pepper_0123456789abcdef
        APP_REQUIRE_HTTPS: "false"
        APP_ENV: test
        RACK_ENV: test
      run: |
        for test_file in test/*_test.rb; do
          bundle exec ruby -Itest "$test_file"
        done
    
    - name: Upload coverage
      uses: codecov/codecov-action@v6
      with:
        files: ./backend-server/coverage/.resultset.json
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: backend-server
    
    - name: Check Ruby syntax
      working-directory: backend-server
      env:
        APP_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        SESSION_TOKEN_PEPPER: ci_session_token_pepper_0123456789abcdef0123456789abcdef
        APP_AUTH_PEPPER: ci_auth_pepper_0123456789abcdef
      run: |
        for file in lib/*.rb app.rb models/*.rb; do
          [ -f "$file" ] && ruby -c "$file" || true
        done
    
    - name: Run RuboCop
      working-directory: backend-server
      run: |
        gem install rubocop
        rubocop --display-cop-names lib/ app.rb models/ || true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        working-directory: backend-server
    
    - name: Run Brakeman security scan
      working-directory: backend-server
      run: |
        gem install brakeman
        brakeman --force --skip-files lib/structured_logger.rb
